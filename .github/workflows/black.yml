name: Lint Codebase

on: [push, pull_request]

jobs:
  lint_codebase:
    name: Lint and format codebase
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v4
      - uses: psf/black@26.5.1
        with:
          version: "26.5.1"
          options: "--check --verbose"
          src: "./projects/jdwp"
