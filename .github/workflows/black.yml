name: Lint Codebase

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

concurrency:
  group: black-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  lint_codebase:
    name: Lint and format codebase
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Check NDK configuration and host selection
        run: python3 scripts/test-ndk-config.py
      - name: Validate selected bpftrace patches and tracefs fallback
        run: make check-bpftrace-patches
      - uses: psf/black@258e7dbf348bc23cb70b8cdf693481c04634ebcc # 26.10.1
        with:
          version: "26.10.1"
          options: "--check --verbose"
          src: "./projects/jdwp ./scripts/test-ndk-config.py ./scripts/test-bpftrace-tracefs.py"
