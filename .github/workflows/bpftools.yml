name: Build bpftools archives

on:
  push:
    paths:
      - .github/workflows/bpftools.yml
      - Makefile
      - projects/**
      - scripts/resolute-install-deps.sh
      - scripts/resolute-local-build.sh
      - sysroot/**
      - toolchains/**
  pull_request:
    paths:
      - .github/workflows/bpftools.yml
      - Makefile
      - projects/**
      - scripts/resolute-install-deps.sh
      - scripts/resolute-local-build.sh
      - sysroot/**
      - toolchains/**

concurrency:
  group: bpftools-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NDK_API: "35"
  NDK_VERSION: r27d

jobs:
  build_bpftools_archives:
    name: Build bpftools archives (${{ matrix.arch }})
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        arch:
          - arm64
          - x86_64
    steps:
      - uses: actions/checkout@v7
      - name: Cache Android NDK
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/android-ndk-${{ env.NDK_VERSION }}
          key: android-ndk-${{ runner.os }}-${{ env.NDK_VERSION }}-linux-x86_64
      - name: Install dependencies
        run: ./scripts/resolute-install-deps.sh
      - name: Build full and minimal archives
        env:
          NDK_ARCH: ${{ matrix.arch }}
          NDK_TMP_DIR: ${{ runner.temp }}
        run: ./scripts/resolute-local-build.sh bpftools bpftools-min
      - uses: actions/upload-artifact@v7
        with:
          name: bpftools-android-${{ matrix.arch }}.tar.gz
          path: out/bpftools-${{ matrix.arch }}.tar.gz
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: bpftools-min-android-${{ matrix.arch }}.tar.gz
          path: out/bpftools-min-${{ matrix.arch }}.tar.gz
          retention-days: 7

  build_bpftrace_static:
    name: Build static bpftrace binaries (${{ matrix.arch }})
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        arch:
          - arm64
          - x86_64
    steps:
      - uses: actions/checkout@v7
      - name: Cache Android NDK
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/android-ndk-${{ env.NDK_VERSION }}
          key: android-ndk-${{ runner.os }}-${{ env.NDK_VERSION }}-linux-x86_64
      - name: Install dependencies
        run: ./scripts/resolute-install-deps.sh
      - name: Build
        env:
          LLVM_BPF_ONLY: "true"
          NDK_ARCH: ${{ matrix.arch }}
          NDK_TMP_DIR: ${{ runner.temp }}
          STATIC_LINKING: "true"
        run: ./scripts/resolute-local-build.sh bpftrace
      - uses: actions/upload-artifact@v7
        with:
          name: bpftrace-android-${{ matrix.arch }}
          path: out/android/${{ matrix.arch }}/bin/bpftrace
          retention-days: 7
