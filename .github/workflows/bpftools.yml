name: Build bpftools archives

on:
  push:
    branches:
      - "**"
    paths:
      - .github/workflows/bpftools.yml
      - Makefile
      - licenses/**
      - projects/**
      - scripts/*.sh
      - sysroot/**
      - toolchains/**
  pull_request:
    paths:
      - .github/workflows/bpftools.yml
      - Makefile
      - licenses/**
      - projects/**
      - scripts/*.sh
      - sysroot/**
      - toolchains/**

concurrency:
  group: bpftools-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NDK_API: "35"
  NDK_VERSION: r27d

jobs:
  build_release_artifacts:
    name: Build three release artifacts (${{ matrix.arch }})
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        arch:
          - arm64
          - x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Cache Android NDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/android-ndk-${{ env.NDK_VERSION }}
          key: android-ndk-${{ runner.os }}-${{ env.NDK_VERSION }}-linux-x86_64
      - name: Install dependencies
        run: ./scripts/resolute-install-deps.sh
      - name: Build full archive, minimal archive, and static bpftrace
        env:
          NDK_ARCH: ${{ matrix.arch }}
          NDK_TMP_DIR: ${{ runner.temp }}
          STATIC_LINKING: "false"
          LLVM_BPF_ONLY: "false"
        run: ./scripts/resolute-local-build.sh bpftools bpftools-min bpftrace-static
      - name: Verify artifacts and generate checksums
        env:
          ARCHES: ${{ matrix.arch }}
          CHECKSUM_FILE: out/SHA256SUMS-${{ matrix.arch }}
        run: |
          ./scripts/verify-artifacts.sh
          ./scripts/generate-checksums.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bpftools-android-${{ matrix.arch }}.tar.gz
          path: |
            out/bpftools-${{ matrix.arch }}.tar.gz
            out/SHA256SUMS-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bpftools-min-android-${{ matrix.arch }}.tar.gz
          path: |
            out/bpftools-min-${{ matrix.arch }}.tar.gz
            out/SHA256SUMS-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bpftrace-android-${{ matrix.arch }}
          path: |
            out/bpftrace-${{ matrix.arch }}
            out/SHA256SUMS-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
