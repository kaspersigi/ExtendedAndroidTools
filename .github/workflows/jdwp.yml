name: Check JDWP project

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_call:

concurrency:
  group: jdwp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  build_jdwp_project:
    name: Build and Test JDWP Project
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
        submodules: recursive
    - name: Install Ubuntu 26.04 build dependencies
      run: ./scripts/resolute-install-deps.sh
    - name: Test, type-check, and format-check JDWP
      # Keep host package installs serialized; recursive native builds still
      # prepare the tools needed by these checks, with at most two build jobs.
      run: make THREADS=2 jdwp-check
