name: Build jdwp project

on: [push, pull_request]

jobs:
  build_jdwp_project:
    name: Build and Test JDWP Project
    runs-on: ubuntu-26.04

    steps:
    - name: Checkout repository and submodules
      uses: actions/checkout@v7
      with:
         submodules: recursive
    - name: Install Ubuntu 26.04 build dependencies
      run: ./scripts/resolute-install-deps.sh
    - name: Build, test, type-check, and format-check
      # Keep host package installs serialized; recursive native builds still
      # use every runner CPU through THREADS.
      run: make THREADS="$(nproc)" jdwp-check
