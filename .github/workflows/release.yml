name: Release Android artifacts

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  THREADS: "2"

jobs:
  lint:
    name: Check formatting
    uses: ./.github/workflows/black.yml

  jdwp:
    name: Check JDWP
    uses: ./.github/workflows/jdwp.yml

  build:
    name: Build release (${{ matrix.arch }})
    needs: [lint, jdwp]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      matrix:
        arch:
          - arm64
          - x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Read NDK configuration
        run: |
          source ./scripts/ndk-config.sh
          ndk_download_defaults "$(ndk_host_tag)"
          printf 'NDK_VERSION=%s\nNDK_API=%s\nNDK_DOWNLOAD_SHA256=%s\n' \
            "$NDK_VERSION" "$NDK_API" "$NDK_DOWNLOAD_SHA256" >> "$GITHUB_ENV"
      - name: Cache Android NDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ runner.temp }}/android-ndk-${{ env.NDK_VERSION }}
          key: android-ndk-${{ runner.os }}-${{ runner.arch }}-${{ env.NDK_VERSION }}-${{ env.NDK_DOWNLOAD_SHA256 }}
      - name: Install dependencies
        run: ./scripts/resolute-install-deps.sh
      - name: Build and verify three artifacts
        env:
          ARCHES: ${{ matrix.arch }}
          CHECKSUM_FILE: out/SHA256SUMS-${{ matrix.arch }}
          NDK_ARCH: ${{ matrix.arch }}
          NDK_TMP_DIR: ${{ runner.temp }}
          STATIC_LINKING: "false"
          LLVM_BPF_ONLY: "false"
        run: |
          ./scripts/resolute-local-build.sh bpftools bpftools-min bpftrace-static
          ./scripts/verify-artifacts.sh
          ./scripts/generate-checksums.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.arch }}
          path: |
            out/bpftools-${{ matrix.arch }}.tar.gz
            out/bpftools-min-${{ matrix.arch }}.tar.gz
            out/bpftrace-${{ matrix.arch }}
            out/SHA256SUMS-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify and combine checksums
        run: |
          cd dist
          sha256sum --check SHA256SUMS-arm64
          sha256sum --check SHA256SUMS-x86_64
          cat SHA256SUMS-arm64 SHA256SUMS-x86_64 | LC_ALL=C sort -k2 > SHA256SUMS
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=(
            dist/bpftools-arm64.tar.gz
            dist/bpftools-min-arm64.tar.gz
            dist/bpftrace-arm64
            dist/bpftools-x86_64.tar.gz
            dist/bpftools-min-x86_64.tar.gz
            dist/bpftrace-x86_64
            dist/SHA256SUMS
          )
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --clobber "${assets[@]}"
          else
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --generate-notes \
              --title "${GITHUB_REF_NAME}" \
              "${assets[@]}"
          fi

      # The Release is the durable copy; keep the one-day artifact expiry as
      # a fallback if publishing or cleanup fails. Rebuild to rerun after cleanup.
      - name: Verify published assets and remove temporary artifacts
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_ASSETS: |
            bpftools-arm64.tar.gz
            bpftools-min-arm64.tar.gz
            bpftrace-arm64
            bpftools-x86_64.tar.gz
            bpftools-min-x86_64.tar.gz
            bpftrace-x86_64
            SHA256SUMS
        run: |
          set -euo pipefail
          trap 'echo "::warning::Artifact cleanup incomplete; remaining artifacts retain their one-day expiry."' ERR
          release_json="$RUNNER_TEMP/published-release-cleanup.json"
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" > "$release_json"
          jq -e --arg tag "$RELEASE_TAG" \
            '.tag_name == $tag and .draft == false and .published_at != null' "$release_json" > /dev/null
          while IFS= read -r asset; do
            [[ -n "$asset" ]] || continue
            local_digest=$(sha256sum "dist/$asset")
            remote_digest=$(jq -er --arg name "$asset" \
              '.assets[] | select(.name == $name and .state == "uploaded") | .digest' "$release_json")
            if [[ "$remote_digest" != "sha256:${local_digest%% *}" ]]; then
              echo "::warning::Published asset digest mismatch: $asset; retaining workflow artifacts."
              exit 1
            fi
          done <<< "$RELEASE_ASSETS"
          # List completely before deletion so pagination cannot skip entries.
          artifact_ids=$(gh api --paginate "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false and (.name == "release-arm64" or .name == "release-x86_64")) | .id')
          while IFS= read -r artifact_id; do
            [[ -n "$artifact_id" ]] || continue
            [[ "$artifact_id" =~ ^[0-9]+$ ]]
            gh api --method DELETE "repos/$GH_REPO/actions/artifacts/$artifact_id"
          done <<< "$artifact_ids"
